name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Cài thư viện
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install "Cython==0.29.33" buildozer virtualenv

      - uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: bz-${{ hashFiles('buildozer.spec') }}

      - name: Build APK
        run: |
          unset ANDROID_NDK_HOME ANDROID_NDK_ROOT
          buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: Outdrive_199X_APK
          path: bin/*.apk
